                    <h1 class="header-title" data-i18n="name">評審委員會</h1>
                    <div class="profile-subtitle" data-i18n="subtitle">
                        評審委員會負責監督邵逸夫獎得獎者的遴選過程，職責包括審議並通過各遴選委員會推薦的獲獎人選，並將最終名單呈報理事會核准確認；組建遴選委員會並提供專業指導，確保遴選工作有效運行；同時制定提名與評審相關規章制度。評審會的運作獨立於理事會。

                <div class="profile-grid">

     <script>
        // 自動依照視窗大小保持 16:9 比例縮放
        function resizeCanvas() {
            const canvas = document.getElementById('canvas');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const scaleX = windowWidth / 1920;
            const scaleY = windowHeight / 1080;
            const scale = Math.min(scaleX, scaleY);

            canvas.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', resizeCanvas);

        const translations = {
            en: {
                title: 'Board of Adjudicators',
                name: 'Board of Adjudicators',
                subtitle: 'The Board of Adjudicators oversees The Shaw Prize awardee selection process. It reviews and approves the awardees recommendations proposed by the Selection Committees, and forwards the final list to the Council for confirmation. The Board is also responsible for establishing and guiding the Selection Committees, ensuring their effective operation. Additionally, it formulates the regulations that govern the nomination and adjudication process. The Board operates independently from the Council.'
            },
            'zh-Hant': {
                title: '評審委員會',
                name: '評審委員會',
                subtitle: '評審委員會負責監督邵逸夫獎得獎者的遴選過程，職責包括審議並通過各遴選委員會推薦的獲獎人選，並將最終名單呈報理事會核准確認；組建遴選委員會並提供專業指導，確保遴選工作有效運行；同時制定提名與評審相關規章制度。評審會的運作獨立於理事會。'
            },
            cn: {
                title: '评审委员会',
                name: '评审委员会',
                subtitle: '评审委员会负责监督邵逸夫奖得奖者的遴选过程，职责包括审议并通过各遴选委员会推荐的获奖人选，并将最终名单呈报理事会核准确认；组建遴选委员会并提供专业指导，确保遴选工作有效运行；同时制定提名与评审相关规章制度。评审会的运作独立于理事会。'
            }
        };

        const imageMap = {
            en: 'Board of Adjudicators.jpg',
            'zh-Hant': 'Board of Adjudicators T.jpg',
            cn: 'Board of Adjudicators T.jpg'
        };

        function updateLanguage(language) {
            const content = translations[language];
            const image = document.getElementById('adjudicators-image');

            document.documentElement.lang = language;
            document.title = content.title;

            document.querySelectorAll('[data-i18n]').forEach((element) => {
                if (content[element.dataset.i18n]) {
                    element.innerHTML = content[element.dataset.i18n];
                }
            });

            if (image && imageMap[language]) {
                image.src = imageMap[language];
                image.alt = content.name;
            }

            document.querySelectorAll('[data-language]').forEach((item) => {
                item.classList.toggle('active', item === document.querySelector(`[data-language="${language}"]`));
            });
        }

        document.querySelectorAll('[data-language]').forEach((button) => {
            button.addEventListener('click', () => {
                updateLanguage(button.dataset.language);
            });
        });
     </script>
