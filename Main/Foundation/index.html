<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Shaw Prize</title>
    <style>
      * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, Microsoft YaHei, PingFang SC, NotoSansTC;
            line-height: 1.5;
            color: #333;
            background-color: #0f172a; /* 背景深色襯托 16:9 画框 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 16:9 画框容器 */
        #canvas {
            width: 1920px;
            height: 1080px;
            background-color: #f8fafc;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
        }

        /* 主佈局容器：16:9 比例下採用橫向兩欄 */
        .container {
            display: flex;
            gap: 40px;
            height: 100%;
            margin-top: 20px;
        }

        /* 左側導航欄樣式 */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            height: fit-content;
        }
        .nav-group {
            margin-bottom: 15px;
        }
         .nav-item {
            display: block;
            padding: 12px 16px;
            color: #c39f5b;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .nav-item:hover {
            background-color: #f3ecde;
            color: #c39f5b;
        }
        .nav-item.active {
            background-color: #c39f5b;
            color: #ffffff;
            font-weight: bold;
        }

        .sub-menu {
            margin-left: 15px;
            margin-top: 8px;
            border-left: 3px solid #cbd5e1;
            padding-left: 12px;
        }
        .sub-item {
            display: block;
            padding: 8px 12px;
            color: #c39f5b;
            text-decoration: none;
            font-size: 1rem;
            border-radius: 4px;
        }
        .sub-itemAstron{
            display: block;
            padding: 8px 12px;
            color: #c39f5b;
            text-decoration: none;
            font-size: 1rem;
            border-radius: 4px;
        }
        .sub-itemComput {
            display: block;
            padding: 8px 12px;
            color: #c39f5b;
            text-decoration: none;
            font-size: 1rem;
            border-radius: 4px;
        }
        .sub-itemLife {
            display: block;
            padding: 8px 12px;
            color: #c39f5b;
            text-decoration: none;
            font-size: 1rem;
            border-radius: 4px;
        }
        .sub-itemMaths {
            display: block;
            padding: 8px 12px;
            color: #c39f5b;
            text-decoration: none;
            font-size: 1rem;
            border-radius: 4px;
        }
        .sub-item:hover {
            color: #0f172a;
            background-color: #f1f5f9;
        }
        .sub-itemAstron:hover {
            color: #fafbfb;
            font-weight: bold;
            background-color: #919abc;
        }
        .sub-itemComput:hover {
            color: #fafbfb;
            font-weight: bold;
            background-color: #b599bf;
        }
        .sub-itemLife:hover {
            color: #fafbfb;
            font-weight: bold;
            background-color: #93aca3;
        }
        .sub-itemMaths:hover {
            color: #fafbfb;
            font-weight: bold;
            background-color: #bc939b;
        }
        .sub-item.active {
            color: #fafbfb;
            font-weight: bold;
            background-color: #802e3e;
        }

        /* 右側主內容區樣式 */
        .main-content {
            flex-grow: 1;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            position: relative;
            display: flex;
            flex-direction: column;

            /* 新增以下這行以啟用垂直捲動 */
            /*overflow-y: auto;    */
        }

        /* 語言切換按鈕 */
        .lang-switch {
            position: absolute;
            top: 30px;
            right: 40px;
            display: flex;
            gap: 8px;
        }
        .lang-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 6px 14px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }
        .lang-btn.active {
            background: #1e293b;
            color: #ffffff;
            border-color: #1e293b;
        }

        .breadcrumb {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 20px;
        }
        .role-badge {
            display: inline-block;
            background-color: #bc939b;
            color: #5f222e;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        .header-title {
            font-size: 2.5rem;
            color: #0f172a;
            margin-bottom: 12px;
        }
        .profile-subtitle {
            font-size: 1.25rem;
            color: #475569;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* 16:9 下特有的雙欄內容展示區 */
        .profile-grid {
            display: grid;
            grid-template-columns: 1200px 1fr;
            gap: 35px;
            margin-top: 10px;
        }

        .profile-photo {
            width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .bio-text {
            color: #334155;
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 18px;
        }
        .terms {
            font-size: 0.95rem;
            color: #64748b;
            background: #f8fafc;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }
        .terms span {
            display: inline-block;
            background: #e2e8f0;
            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 6px;
            color: #334155;
        }
    </style>
</head>
<body>

    <div id="canvas">
    <div class="container">
       <nav class="sidebar">
            <div class="nav-group">
                <a href="./index.html" class="nav-item active" data-i18n="navFoundation">The Shaw Prize Foundation</a>
                <a href="./Council.html" class="nav-item" data-i18n="navCouncil">Council</a>
                <a href="./Board%20of%20Adjudicators.html" class="nav-item" data-i18n="navBoardOfAdjudicators">Board of Adjudicators</a>
                <a href="" class="nav-item active" data-i18n="navSelectionCommittees">Selection Committees</a>

                <!-- 遴選委員會子類別 -->
                <div class="sub-menu">
                    <a href="../.././SelectionCommittees/Astronomy/page/Astronomy.html" class="sub-itemAstron" data-i18n="navAstronomy">Astronomy</a>
                    <a href="../.././SelectionCommittees/ComputerScience/page/" class="sub-itemComput" data-i18n="navComputerScience">Computer Science</a>
                    <a href="https://www.shawprize.org/zh/about/organisation/life-science-medicine" class="sub-itemLife" data-i18n="navLifeScienceMedicine">Life Science & Medicine</a>
                    <a href="https://www.shawprize.org/zh/about/organisation/mathematical-sciences" class="sub-itemMaths" data-i18n="navMathematicalSciences">Mathematical Sciences</a>
                </div>
            </div>
        </nav>

          <main class="main-content">
                <div class="lang-switch">
                    <button type="button" class="lang-btn" data-language="en">ENG</button>
                    <button type="button" class="lang-btn active" data-language="zh-Hant">繁</button>
                    <button type="button" class="lang-btn" data-language="cn">简</button>
                </div>                
                
                <div>                    
                    <h1 class="header-title" data-i18n="name">邵逸夫獎基金會</h1>
                    <div class="profile-subtitle" data-i18n="subtitle">
                        邵逸夫獎基金會成立於2002年11月，旨在表彰在學術與科學研究或應用領域作出卓越貢獻，或其成就對增進人類福祉有重大進展的傑出人士。基金會於2003年5月獲香港稅務局認可為慈善機構。
                        <br>
                    </div>
                </div>


              <div class="profile-grid">
                  <div>
                      <img id="adjudicators-image" src="./mainT.jpg" alt="理事會" class="profile-photo">
                  </div>
              </div>
          </main>
    </div>
        
    </div>
     <script>
        // 自動依照視窗大小保持 16:9 比例縮放
        function resizeCanvas() {
            const canvas = document.getElementById('canvas');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const scaleX = windowWidth / 1920;
            const scaleY = windowHeight / 1080;
            const scale = Math.min(scaleX, scaleY);

            canvas.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            updateLanguage('zh-Hant');
        });

        const translations = {
            en: {
                title: 'The Shaw Prize Foundation',
                name: 'The Shaw Prize Foundation',
                subtitle: 'The Shaw Prize Foundation, established in November 2002, aims to honour individuals who have made distinguished contributions in academic and scientific research, applications, or advancements that profoundly benefit humankind. The Foundation was granted charitable status by the Hong Kong Inland Revenue Department in May 2003.',
                navFoundation: 'The Shaw Prize Foundation',
                navCouncil: 'Council',
                navBoardOfAdjudicators: 'Board of Adjudicators',
                navSelectionCommittees: 'Selection Committees',
                navAstronomy: 'Astronomy',
                navComputerScience: 'Computer Science',
                navLifeScienceMedicine: 'Life Science & Medicine',
                navMathematicalSciences: 'Mathematical Sciences'
            },
            'zh-Hant': {
                title: '邵逸夫獎基金會',
                name: '邵逸夫獎基金會',
                subtitle: '邵逸夫獎基金會成立於2002年11月，旨在表彰在學術與科學研究或應用領域作出卓越貢獻，或其成就對增進人類福祉有重大進展的傑出人士。基金會於2003年5月獲香港稅務局認可為慈善機構。',
                navFoundation: '邵逸夫獎基金會',
                navCouncil: '理事會',
                navBoardOfAdjudicators: '評審會',
                navSelectionCommittees: '遴選委員會',
                navAstronomy: '天文學',
                navComputerScience: '電腦科學',
                navLifeScienceMedicine: '生命科學與醫學',
                navMathematicalSciences: '數學科學',
            },
            cn: {
                title: '邵逸夫奖基金会',
                name: '邵逸夫奖基金会',
                subtitle: '邵逸夫奖基金会成立于2002年11月，旨在表彰在学术与科学研究或应用领域作出卓越贡献，或其成就对增进人类福祉有重大进展的杰出人士。基金会于2003年5月获香港税务局认可为慈善机构。',
                navFoundation: '邵逸夫奖基金会',
                navCouncil: '理事会',
                navBoardOfAdjudicators: '评审会',
                navSelectionCommittees: '遴选委员会',
                navAstronomy: '天文学',
                navComputerScience: '计算机科学',
                navLifeScienceMedicine: '生命科学与医学',
                navMathematicalSciences: '数学科学',
            }
        };

        const imageMap = {
            en: 'main.jpg',
            'zh-Hant': 'mainT.jpg',
            cn: 'mainS.jpg'
        };

        function updateLanguage(language) {
            const content = translations[language];
            const image = document.getElementById('adjudicators-image');

            document.documentElement.lang = language;
            document.title = content.title;

            document.querySelectorAll('[data-i18n]').forEach((element) => {
                if (content[element.dataset.i18n]) {
                    element.innerHTML = content[element.dataset.i18n];
                }
            });

            if (image && imageMap[language]) {
                image.src = imageMap[language];
                image.alt = content.name;
            }

            document.querySelectorAll('[data-language]').forEach((item) => {
                item.classList.toggle('active', item === document.querySelector(`[data-language="${language}"]`));
            });
        }

        document.querySelectorAll('[data-language]').forEach((button) => {
            button.addEventListener('click', () => {
                updateLanguage(button.dataset.language);
            });
        });
     </script>
</body>
</html>
